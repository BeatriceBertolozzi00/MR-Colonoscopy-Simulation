aurora_publisher_node:
  ros__parameters:

    # Serial connection
    serial_port: "/dev/ttyUSB0"
    baud_rate: 230400
    serial_timeout_sec: 2.0

    # Multi-sensor configuration
    num_sensors: 2

    # ROM file for the endoscope sensor (0B)
        tool_rom_files:
      - "__AURORA_ROM_PATH__"

    # Port 0A: Aurora calibration probe
    # Port 0B: Endoscope sensor
    port_handles: ["0A", "0B"]
    port_handles_autoconfig: ["0A"]

    # ROS 2 topics and reference frames
    topic_names: ["aurora/sensor0", "aurora/sensor1"]
    child_frame_names: ["endo_aurora_sensor0", "endo_aurora_sensor1"]

    frame_id: "aurora_base"
    reference_port: "10"

    # Tracking settings
    track_reply_option: 80
    measure_reply_option: "0001"
    status_reply: true

    # ROS 2 publishing
    publish_rate_hz: 40.0
    queue_size: 10

    # Data filtering
    enable_data_filtering: true
    filter_window_size: 4

    position_scale_factor: 1.0
    orientation_scale_factor: 1.0
    error_scale_factor: 1.0

    # Connection settings
    command_timeout_sec: 2.0
    max_connection_retries: 3
    retry_delay_sec: 2.0

    # Debug
    debug_mode: false
    log_raw_data: false